'use strict';
const N=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];const OPEN=[4,11,7,2,9,4];const MIDI_OPEN=[64,59,55,50,45,40];const MAJOR=[0,2,4,5,7,9,11];const SHARP={Db:'C#',Eb:'D#',Gb:'F#',Ab:'G#',Bb:'A#'};const mod=(n,m)=>((n%m)+m)%m;const pitch=(s,f)=>mod(OPEN[s-1]+f,12);const name=(s,f)=>N[pitch(s,f)];const pc=n=>N.indexOf(SHARP[n]||n);const noteAnswer=(s,f,a)=>pc(a)===pitch(s,f);const rand=n=>Math.floor(Math.random()*n);const pick=a=>a[rand(a.length)];const escapeHtml=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const MAJOR_SCALE_SPELLING={
C:['C','D','E','F','G','A','B'],
Db:['Db','Eb','F','Gb','Ab','Bb','C'],
D:['D','E','F#','G','A','B','C#'],
Eb:['Eb','F','G','Ab','Bb','C','D'],
E:['E','F#','G#','A','B','C#','D#'],
F:['F','G','A','Bb','C','D','E'],
Gb:['Gb','Ab','Bb','Cb','Db','Eb','F'],
G:['G','A','B','C','D','E','F#'],
Ab:['Ab','Bb','C','Db','Eb','F','G'],
A:['A','B','C#','D','E','F#','G#'],
Bb:['Bb','C','D','Eb','F','G','A'],

};
function pcSpelled(n){return ({Cb:11,'E#':5,'B#':0,Fb:4}[n]??pc(n))}
function scaleDegreeTiles(scale,highlight=[0,2,4],rootIndex=0){
 return '<div class="degree-row">'+scale.map((n,i)=>'<div class="degree-cell '+(highlight.includes(i)?(i===rootIndex?'root-tone':'chord-tone'):'')+'"><strong>'+n+'</strong><span>'+String(i+1)+'</span></div>').join('')+'</div>';
}
function chordFromKey(key,degree){
 const major=MAJOR_SCALE_SPELLING[key],rootName=major[degree],chordName=degree===0||degree===3||degree===4?rootName:rootName;
 return {name:chordName,tones:[major[degree],major[(degree+2)%7],major[(degree+4)%7]],degrees:[degree,(degree+2)%7,(degree+4)%7]};
}
function theoryDemo(key='G',which=0){
 const scale=MAJOR_SCALE_SPELLING[key]||MAJOR_SCALE_SPELLING.G;
 const choices=[0,3,4],degree=choices[which]??0, c=chordFromKey(key,degree);
 const label=['I','IV','V'][which]||'I';
 return '<div class="theory-mini"><h3>Watch how the '+label+' chord comes from '+key+' major</h3>'+
 '<p class="small muted">Every box is one note of the '+key+' major scale. Orange is the current chord root, teal is the third and fifth. Gray notes remain available for passing notes and melodic movement.</p>'+
 '<div class="controls">'+choices.map((d,i)=>'<button class="'+(i===which?'primary':'')+'" data-degreechoice="'+i+'">'+['I','IV','V'][i]+' · '+scale[d]+'</button>').join('')+'</div>'+

 '<p><strong>'+label+' = '+c.name+' major = '+c.tones.join(' – ')+'</strong></p>'+
 '<p>The <strong>root</strong> is '+c.tones[0]+', the <strong>third</strong> is '+c.tones[1]+', and the <strong>fifth</strong> is '+c.tones[2]+'. These three belong to the '+key+' major scale, but they define the '+c.name+' chord specifically.</p>'+
 '<p class="small">Try playing one of these three notes as the band moves to '+c.name+'. Compare it with a non-chord scale note: the latter is not necessarily wrong, but may create movement or tension.</p>'+
 '<div class="controls"><button data-show-fb=\"1\">Show this chord on the fretboard ↓</button><button data-play-demo=\"'+pcSpelled(c.name)+'\">▶ Hear '+c.name+' triad</button></div>'+
 '<div id="degreeFb" class="fbscroll"></div></div>';
}
function wireTheoryDemo(key,containerId){
 const el=$(containerId);if(!el)return;let selected=0;
 function draw(){el.innerHTML=theoryDemo(key,selected);el.querySelectorAll('[data-degreechoice]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.degreechoice);draw()});el.querySelector('[data-play-demo]').onclick=e=>chord(Number(e.target.dataset.playDemo),'major',1.3);el.querySelector('[data-show-fb]').onclick=()=>{const scale=MAJOR_SCALE_SPELLING[key],idx=[0,3,4][selected],wanted=chordFromKey(key,idx),positions=[];for(let st=1;st<=6;st++)for(let f=0;f<=12;f++)if(wanted.tones.map(pcSpelled).includes(pitch(st,f)))positions.push({s:st,f});el.querySelector('#degreeFb').innerHTML=fretboard({show:'none',highlights:positions});el.querySelector('#degreeFb').scrollIntoView({block:'nearest'});attachFret((st,f)=>tone(MIDI_OPEN[st-1]+f,.6))}}
 draw();
}

function syncCloud(force=false){if(!cloud.url||!safeKey(cloud.key)||cloudBusy)return;if(!force && state.updatedAt<=cloudLastUpload)return;cloudBusy=true;const at=state.updatedAt;cloudStatus='Sending backup…';const payload={action:'save',key:cloud.key,state:state};fetch(cloud.url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),keepalive:true}).then(()=>{cloudLastUpload=at;cloudStatus='Backup sent · verify with Restore from Sheets';cloudLastResult='POST sent; confirmation requires reading the saved record.';}).catch(()=>{cloudStatus='Cloud unavailable · progress remains saved locally';cloudLastResult='Upload failed; try Backup now again.'}).finally(()=>{cloudBusy=false;if(state.updatedAt>at)scheduleCloud();updateCloudLabel()})}
function loadCloud(){if(!cloud.url||!safeKey(cloud.key)){cloudStatus='Enter a valid Apps Script URL and profile code';updateCloudLabel();return}cloudStatus='Checking Google Sheets…';updateCloudLabel();const callback='ffLoad_'+Math.random().toString(36).slice(2);const script=document.createElement('script');let finished=false;const timer=setTimeout(()=>done({ok:false,error:'Google Sheets did not respond. Check your deployment and URL.'}),14000);function done(data){if(finished)return;finished=true;clearTimeout(timer);delete window[callback];script.remove();if(!data||!data.ok){cloudStatus='Cloud load failed: '+String(data&&data.error||'unknown error');updateCloudLabel();return}if(!data.state){cloudStatus='No existing cloud backup for this profile · local progress retained';updateCloudLabel();scheduleCloud();return}const remote=data.state;if(!remote || !Array.isArray(remote.history) || !Array.isArray(remote.completed) || !Number.isFinite(Number(remote.updatedAt))){cloudStatus='Unexpected cloud data; local progress retained';updateCloudLabel();return}const localTime=Number(state.updatedAt)||0,remoteTime=Number(remote.updatedAt)||0;if(remoteTime>localTime){state={...structuredClone(DEFAULT),...remote};state.location=state.location||structuredClone(DEFAULT.location);state.settings=state.settings||{sound:true};persistLocal();cloudLastUpload=remoteTime;cloudStatus='Cloud progress restored';render();}else{cloudStatus='Local progress is current';if(localTime>remoteTime)scheduleCloud()}updateCloudLabel()}window[callback]=done;script.onerror=()=>done({ok:false,error:'Unable to load script'});script.src=cloud.url+'?action=load&key='+encodeURIComponent(cloud.key)+'&callback='+callback+'&t='+Date.now();document.head.appendChild(script)}

function setCloudConfig(url,key){const valid=cleanUrl(url);if(!valid||!safeKey(key))return 'Use a deployed Google Apps Script /exec URL and a profile code of 16–90 letters/numbers.';cloud={url:valid,key:key};localStorage.setItem(CLOUD_CONFIG,JSON.stringify(cloud));cloudLastUpload=0;loadCloud();return ''}
let page='home',mode='find',question=null,selected=new Set(),lastFeedback='',answerLocked=false,gameRound=0,jamChord=0,jamRunning=false,jamTimer=null,audio=null;const $=id=>document.getElementById(id);const app=$('app');

function go(p){stopJam();page=p;state.location={page:p,lesson:null,mode:mode};save();document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();window.scrollTo({top:0,behavior:'instant'})}document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
function audioCtx(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}function tone(midi,dur=.7,at=0,vol=.14,type='sine'){if(!state.settings.sound)return;let c=audioCtx(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime+at;o.type=type;o.frequency.value=440*Math.pow(2,(midi-69)/12);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.03)}function chord(root,quality='major',dur=1.1,delay=0){let base=48+root;[0,quality==='minor'?3:4,7].forEach((n,i)=>tone(base+n,dur,delay+i*.04,.075,'triangle'))}function feedback(text,ok){const el=$('feedback');if(el){el.className='feedback '+(ok===true?'ok':ok===false?'bad':'');el.innerHTML=text}}function record(ok,label){state.attempts++;if(ok){state.correct++;state.streak++;state.best=Math.max(state.streak,state.best);state.xp+=state.streak%5===0?125:100}else state.streak=0;state.history.push({at:Date.now(),ok,label});state.history=state.history.slice(-200);save()}
function fretboard(opts={}){let {show='none',clickable=true,range=12,highlights=[],start=0,triadRoot=0,triadNames=['C','E','G']}=opts;const w=940,h=255,lo=start,hi=Math.min(12,start+range),step=65;let svg=`<div class="fbscroll"><svg class="fretboard" viewBox="0 0 ${w} ${h}" role="group" aria-label="Interactive guitar fretboard. Strings shown high E at top to low E at bottom.">`;for(let f=lo;f<=hi;f++){let x=77+(f-lo)*step;svg+=`<text x="${x}" y="25" fill="#b6c7d3" text-anchor="middle" font-size="15">${f||'open'}</text>`}for(let f=lo;f<hi;f++){let x=110+(f-lo)*step;svg+=`<line x1="${x}" y1="50" x2="${x}" y2="210" stroke="#667e8c" stroke-width="${f===0?5:2}" opacity=".6"/>`}for(let s=1;s<=6;s++){let y=62+(s-1)*29;svg+=`<line x1="34" y1="${y}" x2="${110+(hi-lo)*step}" y2="${y}" stroke="#b9a78d" stroke-width="${1+s*.37}"/><text x="18" y="${y+5}" fill="#d2dce2" font-size="15" text-anchor="middle">${['e','B','G','D','A','E'][s-1]}</text>`;for(let f=lo;f<=hi;f++){let x=77+(f-lo)*step,id=`${s}:${f}`,n=pitch(s,f),highlight=highlights.some(a=>a.s===s&&a.f===f),triadOffsets=[0,4,7],triadIndex=triadOffsets.indexOf((n-triadRoot+12)%12),visible=highlight||(show==='all')||(show==='cmajor'&&MAJOR.includes(n))||(show==='ctriad'&&[0,4,7].includes(n))||(show==='majortriad'&&triadIndex>=0),fill=(show==='majortriad'?n===triadRoot:n===0)?'#e7a16f':'#49bfb2',txt=show==='majortriad'&&triadIndex>=0?triadNames[triadIndex]:show==='ctriad'?[0,4,7].includes(n)?['1','3','5'][[0,4,7].indexOf(n)]:'':N[n];if(highlight){fill='#ffd88d';txt=N[n]}svg+=`<g class="${clickable?'fret-hit':''}" ${clickable?`tabindex="0" role="button" aria-label="String ${s} fret ${f}, ${visible?N[n]:'hidden note'}" data-s="${s}" data-f="${f}"`:''}><circle class="hitbox" cx="${x}" cy="${y}" r="15" fill="${visible?fill:'transparent'}" stroke="${selected.has(id)?'#fff5bd':visible?'#0a1824':'#6a7c85'}" stroke-width="${selected.has(id)?4:visible?1:.25}"/><text x="${x}" y="${y+5}" fill="${visible?'#09202b':'transparent'}" font-we function attachFret(cb){document.querySelectorAll('.fret-hit').forEach(g=>{function action(){cb(+g.dataset.s,+g.dataset.f)}g.addEventListener('click',action);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();action()}})})}
const lessonData=[{title:'The musical alphabet and your fretboard',source:'JustinGuitar Grade 1; Grade 2',parts:[['A guitar has 12 repeating pitch classes','Western equal-tempered tuning divides an octave into 12 semitones. The natural note letters are A B C D E F G, and then they repeat. The adjacent natural pairs B–C and E–F are only one semitone apart; most other adjacent letter names are two semitones apart.'],['Sharps, flats, and enharmonic names','A sharp raises a note by one semitone; a flat lowers it by one semitone. C# and Db can name the same sounding pitch in equal temperament; the appropriate spelling depends on the harmonic context. One fret along the same guitar string equals one semitone.'],['Know your six open strings','From thickest (string 6) to thinnest (string 1), standard tuning is E–A–D–G–B–E. The first and sixth strings share note names at identical fret numbers, two octaves apart.'],['Calculate any note','Start from the open string note and advance one semitone per fret. Example: string 4 is open D; fret 1 is Eb, fret 2 is E, fret 3 is F, fret 5 is G, and fret 7 is A. The twelfth fret repeats the open-string note an octave higher.'],['Make the knowledge musical','Pick a C on your guitar. Play it, hum it, then find another C on a different string. Play both. Repeat for G and A. The goal is to recognize the locations without counting each fret.']]},{title:'Intervals, octaves, and musical distance',source:'JustinGuitar Grades 1, 3 and Grade 4 Module 3; added practical interval exercises',parts:[['An interval measures distance between pitches','A semitone is a one-fret step; a whole tone is two frets. Intervals also have degree names. From C, D is a major second (2 semitones), E is a major third (4), F is a perfect fourth (5), G is a perfect fifth (7), and the higher C is an octave (12).'],['Intervals stay the same when the key changes','The root-to-major-third relationship is always four semitones, whether C to E, G to B, or A to C#. Instead of memorizing isolated note pairs, you can learn the musical distance and apply it anywhere.'],['Octave patterns connect the neck','An octave is 12 semitones higher. From string 6 fret 3 (G), another G lies on string 4 fret 5. From string 5 fret 3 (C), the octave is on string 3 fret 5. Crossing the G-to-B tuning irregularity changes some octave shapes: from string 4 fret 3 (F) to string 2 fret 6 (F).'],['Major and minor thirds change the feeling of a chord','C–E is a major third (four semitones), while C–Eb is a minor third (three). In a C chord, changing the third from E to Eb turns C major into C minor when the root and fifth remain unchanged.'],['Use intervals to improvise','Over C major, target C, E, or G. Over F major, target F, A, or C. F belongs to the C major scale, but the stronger explanation for landing on it when the chord changes is that F is the root of the new chord. Practice hearing the difference.']]}];

function home(){app.innerHTML=`<div class="panel"><div class="eyebrow">Guitar theory lab · Prototype 1.1</div><h1>Learn it. See it.<br><span class="glow">Hear it. Play it.</span></h1><p>Build a mental map of the neck, understand why notes work, and practice targeting chord tones when you improvise. Original lessons based on the topics in your JustinGuitar workbooks.</p><div class="controls"><button class="primary" id="resume">▶ Resume last activity</button><button id="startLesson">Browse lessons</button><button id="startGame">Play a game</button><button id="startJam">Open Jam Lab</button><button id="startStudio">Practice Studios</button></div></div><div class="grid"><div class="stat"><span class="muted">Lifetime XP</span><b>${state.xp}</b></div><div class="stat"><span class="muted">Answer accuracy</span><b>${state.attempts?Math.round(100*state.correct/state.attempts)+'%':'—'}</b></div><div class="stat"><span class="muted">Longest streak</span><b>${state.best}</b></div><div class="stat"><span class="muted">Lessons completed</span><b>${state.completed.length} / 2</b></div></div><div class="panel"><h2>What to do today</h2><div class="grid"><div><h3>1 · Understand</h3><p>Study one lesson with a playable fretboard and worked examples.</p></div><div><h3>2 · Retrieve</h3><p>Play two quick rounds without labels; test your memory before checking.</p></div><div><h3>3 · Make music</h3><p>Play over a C–F–G progression and aim for the current chord's root, third, or fifth.</p></div></div></div><div class="panel"><h2>Fretboard quick reference</h2><p class="muted">C major highlighted; orange = roots. Turn this mental map into immediate recognition.</p>${fretboard({show:'cmajor',clickable:false})}</div><p class="footer">A personal study companion. Not affiliated with or endorsed by JustinGuitar. No workbook pages or proprietary diagrams reproduced.</p>`;$('resume').onclick=resumeLast;$('startLesson').onclick=()=>go('learn');$('startGame').onclick=()=>go('games');$('startJam').onclick=()=>go('jam');$('startStudio').onclick=()=>go('studio')}
function resumeLast(){let loc=state.location||DEFAULT.location;if(loc.page==='learn'&&Number.isInteger(loc.lesson)&&lessonData[loc.lesson]){go('learn');openLesson(loc.lesson)}else if(loc.page==='games'){go('games');startMode(loc.mode||'find')}else go(['home','learn','games','jam','studio','theory','triads','progress','future'].includes(loc.page)?loc.page:'learn')}function learn(){let cards=lessonData.map((l,i)=>`<div class="panel"><div class="eyebrow">Lesson ${i+1} ${state.completed.includes(i)?'· completed ✓':''}</div><h2>${l.title}</h2><p class="muted">${l.source}</p><p>${l.parts.length} guided sections · interactive examples · playing assignment</p><button class="primary" data-openlesson="${i}">${state.completed.includes(i)?'Review lesson':'Open lesson'}</button></div>`).join('');app.innerHTML=`<div class="eyebrow">Foundations</div><h1>Learn the relationships</h1><p>Two detailed lessons are fully playable in this first prototype. Four later chapters—major scales, triads, connecting positions, and improvisation—are planned next; their game concepts are available as early previews.</p><div class="grid">${cards}</div><div class="panel soft"><h3>Next curriculum chapters</h3><p>3 · Major scales and scale degrees &nbsp; 4 · Triads and chord tones &nbsp; 5 · Position connections and CAGED &nbsp; 6 · Musical improvisation.</p></div>`;document.querySelectorAll('[data-openlesson]').forEach(b=>b.onclick=()=>openLesson(+b.dataset.openlesson))}
function openLesson(i){state.location={page:'learn',lesson:i,mode:mode};state.lesson=i;save();let l=lessonData[i];app.innerHTML=`<button id="back">← Lessons</button><div class="panel lesson"><div class="eyebrow">Lesson ${i+1} of 2</div><h1>${l.title}</h1><p class="muted">Aligned to: ${l.source}</p>${l.parts.map(([h,p],j)=>`<section><h3>${j+1}. ${h}</h3><p>${p}</p></section>`).join('')}<h2>Explore on the guitar</h2><div class="controls">${theoryLink('scale','Major scales explained')}${theoryLink('triads','Triads explained')}</div><p>Play these notes on the virtual fretboard, then locate them on your own instrument. Toggle the labels after studying.</p><div class="controls"><button id="labels" class="active">Hide note labels</button><button id="cscale">Highlight C major</button><button id="ctriad">Show C triad tones</button></div><div class="panel soft" style="margin:18px 0"><h3>Major Triad Explorer · All 12 roots</h3><p class="muted">Select a major chord. The guitar highlights its three notes everywhere on the neck, including repeated octaves. Orange = root; teal = third or fifth.</p><label for="triadchord"><strong>Choose a major chord</strong></label><select id="triadchord" style="max-width:280px;width:100%;margin:8px 0 12px;padding:10px;border-radius:9px;background:#213447;color:#f1f5f7;border:1px solid #667e8c">${MAJOR_TRIADS.map(([label,root])=>`<option value="${root}">${label} major</option>`).join('')}</select><div id="triadnotes" class="note" aria-live="polite"></div><button id="playtriad">▶ Hear triad</button><p class="small muted" style="margin:9px 0 0">Tip: tap any highlighted fret to hear it, then play root–third–fifth on your actual guitar. Your selected chord is remembered on return.</p></div><div id="lessonfb"></div><div id="feedback" class="feedback">Select a fret position to hear its note and see the pitch name.</div><h2>Apply it physically</h2><div class="note">${i===0?'Find C on every string between frets 1 and 12; then play all six locations in order and reverse.':'Play C on string 5 fret 3, then its octave on string 3 fret 5. Next, play C–E (major third) and C–Eb (minor third) on string 5. Sing the higher note after each pair.'}</div><div class="controls"><button class="primary" id="complete">${state.completed.includes(i)?'Completed ✓ · Practice again':'Mark lesson complete ✓'}</button><button id="practice">Practice in games →</button></div></div>`;$('back').onclick=()=>go('learn');let display='majortriad';let triadRoot=Number.isInteger(state.settings.chordRoot)?state.settings.chordRoot:0;function draw(){const entry=MAJOR_TRIADS.find(a=>a[1]===triadRoot)||MAJOR_TRIADS[0];$('triadchord').value=String(triadRoot);$('triadnotes').innerHTML=`<strong>${entry[0]} major = ${entry[2].join(' · ')}</strong><div class="small muted">Root (1): ${entry[2][0]} &nbsp;·&nbsp; Major third (3): ${entry[2][1]} &nbsp;·&nbsp; Perfect fifth (5): ${entry[2][2]}</div>`;$('lessonfb').innerHTML=fretboard({show:display,triadRoot,triadNames:entry[2]});attachFret((s,f)=>{tone(MIDI_OPEN[s-1]+f,.8);feedback(`String ${s}, fret ${f} = <strong>${name(s,f)}</strong>. ${f===12?'This is one octave above the open string.':''}`,true)})};$('triadchord').onchange=e=>{triadRoot=Number(e.target.value);state.settings.chordRoot=triadRoot;save();display='majortriad';draw()};$('playtriad').onclick=()=>chord(triadRoot,'major',1.3);draw();$('labels').onclick=()=>{display=display==='none'?'all':'none';$('labels').textContent=display==='none'?'Show note labels':'Hide note labels';draw()};$('cscale').onclick=()=>{display='cmajor';draw()};$('ctriad').onclick=()=>{triadRoot=0;display='majortriad';draw()};$('complete').onclick=()=>{if(!state.completed.includes(i)){state.completed.push(i);state.xp+=200;save()}$('complete').textContent='Completed ✓'};$('practice').onclick=()=>go('games')}
function games(){app.innerHTML=`<div class="eyebrow">Four ways to internalize</div><h1>Practice games</h1><p>Every game is playable. The first two focus on the foundation lessons; the others preview more advanced skills.</p><div class="grid">${[['find','01 · Fretboard Explorer','Identify notes and click their locations.'],['forge','02 · Theory Forge','Construct note sequences, major intervals, and triads.'],['ear','03 · Ear Detective','Recognize intervals using synthesized pitches.'],['quest','04 · Improvisation Quest','Target roots, thirds, and fifths over C–F–G.']].map(([id,title,desc])=>`<div class="panel"><h3>${title}</h3><p>${desc}</p><button class="primary" data-mode="${id}">Play →</button></div>`).join('')}</div><div id="gamezone"></div>`;document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>startMode(b.dataset.mode))}

function qFind(){let useReverse=Math.random()<.5, s=1+rand(6),f=rand(13),target=pick(['C','D','E','F','G','A','B']);question={s,f,target,useReverse};let prompt=useReverse?`Find <strong>${target}</strong> anywhere between frets 0 and 12. Click one correct location.`:`What note is on <strong>string ${s}, fret ${f}</strong>?`;let body=`<h2>Fretboard Explorer</h2><p>${prompt}</p>${fretboard({show:'none',highlights:useReverse?[]:[{s,f}]})}<div class="small muted">String 1 = thinnest high E · string 6 = thickest low E</div>${useReverse?'':`<div class="choices">${N.map(n=>`<button data-answer="${n}">${n}</button>`).join('')}</div>`}${nextButton()}`;gameShell('Fretboard Explorer',body);bindNext();if(useReverse)attachFret((ss,ff)=>{if(answerLocked)return;let ok=name(ss,ff)===target;result(ok,`String ${ss}, fret ${ff} is ${name(ss,ff)}. ${ok?'You located the requested pitch.':'The requested pitch was '+target+'.'}`,'fretboard')});else{attachFret(()=>{});document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>result(noteAnswer(s,f,b.dataset.answer),`String ${s} starts on ${N[OPEN[s-1]]}; fret ${f} is <strong>${name(s,f)}</strong> (${f} semitones higher).`,'fretboard'))}}
const FORGE=[{ask:'Complete the major scale formula:',options:['T–T–S–T–T–T–S','T–S–T–T–S–T–T','T–T–T–S–T–T–S'],right:0,why:'Every major scale moves tone, tone, semitone, tone, tone, tone, semitone.'},{ask:'Which three notes make a C major triad?',options:['C–E–G','C–Eb–G','C–F–G'],right:0,why:'Major triads use 1–3–5. For C, that means C, E and G.'},{ask:'Which note changes when C major becomes C minor?',options:['The root C becomes B','The third E becomes Eb','The fifth G becomes F#'],right:1,why:'Minor triads lower the major third by one semitone while retaining root and perfect fifth.'},{ask:'On one string, a major third is how many frets?',options:['3','4','5'],right:1,why:'A major third is four semitones. Each fret corresponds to one semitone.'},{ask:'What is the perfect fifth of F?',options:['Bb','C','D'],right:1,why:'F major is F G A Bb C D E. Its fifth degree is C.'},{ask:'Which are the notes of F major?',options:['F–A–C','F–Ab–C','F–A–Db'],right:0,why:'F major triad uses F (root), A (major third), and C (perfect fifth).'}, {ask:'The distance B to C is:',options:['A semitone','A whole tone','A major third'],right:0,why:'B–C and E–F are the adjacent natural-note semitone pairs.'},{ask:'In a C–F change, which note is common to both major triads?',options:['E','C','F'],right:1,why:'C major is C–E–G and F major is F–A–C. C is a common tone.'}];
function qForge(){let q=pick(FORGE);question=q;gameShell('Theory Forge',`<h2>Build your understanding</h2><p>${q.ask}</p><div class="choices">${q.options.map((o,i)=>`<button data-answer="${i}">${o}</button>`).join('')}</div>${nextButton()}`);bindNext();document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>result(+b.dataset.answer===q.right,q.why,'theory'))}
const EARS=[{semitones:1,label:'semitone',other:'whole tone'},{semitones:2,label:'whole tone',other:'semitone'},{semitones:3,label:'minor third',other:'major third'},{semitones:4,label:'major third',other:'minor third'},{semitones:7,label:'perfect fifth',other:'perfect fourth'},{semitones:5,label:'perfect fourth',other:'perfect fifth'},{semitones:12,label:'octave',other:'perfect fifth'}];function qEar(){let q=pick(EARS),base=50+rand(12),opts=Math.random()<.5?[q.label,q.other]:[q.other,q.label];question={...q,base};gameShell('Ear Detective',`<h2>Listen, then name the interval</h2><p>Two ascending notes will play. Try singing the second note before answering.</p><div class="controls"><button class="primary" id="playpair">▶ Play interval</button><button id="playagain">↻ Replay</button></div><div class="choices">${opts.map(o=>`<button data-answer="${o}">${o}</button>`).join('')}</div>${nextButton()}`);bindNext();function play(){tone(base,.65,0,.17);tone(base+q.semitones,.8,.85,.17)}$('playpair').onclick=play;$('playagain').onclick=play;document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>result(b.dataset.answer===q.label,`The interval is a <strong>${q.label}</strong>: ${q.semitones} semitone${q.semitones!==1?'s':''} (${q.semitones} fret${q.semitones!==1?'s':''} on one string).`,'ear'))}
const CHORDS=[{label:'C major',root:0,tones:[0,4,7],degree:['root','major third','perfect fifth']},{label:'F major',root:5,tones:[5,9,0],degree:['root','major third','perfect fifth']},{label:'G major',root:7,tones:[7,11,2],degree:['root','major third','perfect fifth']}];function qQuest(){let q=pick(CHORDS),degree=rand(3),target=q.tones[degree];question={q,degree,target};gameShell('Improvisation Quest',`<h2>Target the chord tone</h2><p>You're improvising in C major. The backing chord is <strong>${q.label}</strong>. Click any <strong>${q.degree[degree]}</strong> note of that chord on the fretboard. Then play it on your guitar.</p><div class="controls"><button id="playchord">▶ Hear ${q.label}</button><button id="hint">Reveal chord tones (hint)</button></div><div id="gamefb">${fretboard({show:'none'})}</div>${nextButton()}`);bindNext();$('playchord').onclick=()=>chord(q.root);$('hint').onclick=()=>{ $('gamefb').innerHTML=fretboard({highlights:Array.from({length:6},(_,i)=>Array.from({length:13},(_,f)=>({s:i+1,f}))).flat().filter(n=>q.tones.includes(pitch(n.s,n.f)))});attachFret(click)};function click(s,f){if(answerLocked)return;let n=pitch(s,f);tone(MIDI_OPEN[s-1]+f,.7);result(n===target,`${N[n]} is ${q.tones.includes(n)?'a chord tone':'not a chord tone'} of ${q.label}. The requested ${q.degree[degree]} is <strong>${N[target]}</strong>. ${q.label} contains ${q.tones.map(i=>N[i]).join('–')}.`,'quest')}attachFret(click)}
function stopJam(){jamRunning=false;if(jamTimer)clearInterval(jamTimer);jamTimer=null}function jam(){stopJam();jamChord=0;app.innerHTML=`<div class="eyebrow">Make music</div><h1>Jam Lab: C–F–G–C</h1><p>Play a simple I–IV–V progression while looking at available notes and chord tones. Use your real guitar alongside the audio. The app cannot yet verify what you play.</p><div class="panel"><div class="controls"><label for="bpm">Tempo</label><select id="bpm"><option>60</option><option selected>80</option><option>100</option><option>120</option></select><label for="highlight">Show</label><select id="highlight"><option value="triad">Current chord tones</option><option value="scale">C major scale</option><option value="none">No note hints</option></select><button class="primary" id="jamplay">▶ Start progression</button><button id="jamstop">■ Stop</button></div><div id="jamstatus" class="note">Ready: play a note from C major.</div><div id="jamfb"></div><div id="feedback" class="feedback">Tap a fret to hear it. Try to land on the current chord's third when the chord changes.</div></div><div class="panel"><h2>Three musical missions</h2><div class="grid"><div class="task"><h3>1. Roots</h3><p>Play C on C, F on F, and G on G. Hold each target note long enough to hear how it settles.</p></div><div class="task"><h3>2. Thirds</h3><p>Aim for E over C, A over F, and B over G. These thirds establish each chord's major quality.</p></div><div class="task"><h3>3. Small phrases</h3><p>Create a three- or four-note idea, leave silence, then answer it. Move between two areas of the neck.</p></div></div><div class="note warning">A chord sounding in the background does not make every scale note equally stable. Chord tones are landing targets; non-chord scale notes can create tension and movement.</div></div>`;let progress=[CHORDS[0],CHORDS[1],CHORDS[2],CHORDS[0]];function update(){let q=progress[jamChord];$('jamstatus').innerHTML=`Now playing: <strong>${q.label}</strong> · aim for <strong>${q.tones.map(i=>N[i]).join(' / ')}</strong> · chord ${jamChord+1}/4`;let v=$('highlight').value,highlights=[];if(v==='triad')for(let s=1;s<=6;s++)for(let f=0;f<=12;f++)if(q.tones.includes(pitch(s,f)))highlights.push({s,f});$('jamfb').innerHTML=fretboard({show:v==='scale'?'cmajor':'none',highlights});attachFret((s,f)=>{tone(MIDI_OPEN[s-1]+f,.8);feedback(`Played <b>${name(s,f)}</b>. ${q.tones.includes(pitch(s,f))?'Chord tone — strong landing note.':MAJOR.includes(pitch(s,f))?'Part of C major, but not a chord tone right now.':'Outside the C major scale; try hearing its tension.'}`,q.tones.includes(pitch(s,f)))})}update();$('highlight').onchange=update;$('jamplay').onclick=()=>{stopJam();jamChord=0;jamRunning=true;function beat(){chord(progress[jamChord].root,'major',1.15);update();jamChord=(jamChord+1)%4}beat();let bpm=+$('bpm').value;jamTimer=setInterval(beat,60000/bpm*4);$('jamplay').textContent='↻ Restart progression'};$('jamstop').onclick=()=>{stopJam();$('jamstatus').textContent='Stopped. Choose a new mission or restart.'}}

const THEORY_TITLES={numbers:'I, IV, V: understanding chord numbers',triads:'Roots, thirds and fifths',scale:'Keys, scales and why notes work',rhythm:'Bluegrass boom-chuck and jam rhythm',breaks:'Taking an improvised bluegrass break',speed:'Building flatpicking speed',electric:'Using your looper to explore sound'};
const FOUNDATION_TOPICS={
foundation:{title:'1 · Notes, frets and whole tones',sections:[
['Why this belongs in every style','Scales describe note collections; intervals describe distances; chords describe combinations. These ideas support acoustic songs, blues leads, bluegrass breaks, rock riffs and jazz harmony. Rhythm, technique and listening matter alongside them. You can begin making music before memorizing every key.'],
['Twelve pitches, seven letter names','In standard tuning the strings, thickest to thinnest, are E–A–D–G–B–E. One fret raises a note one semitone (half step). Two frets raise it one whole tone (whole step). The octave spans twelve semitones. Between E and F, and between B and C, there is only one semitone.'],
['Your bend question','G string fret 7 is D. Fret 8 is D♯/E♭; fret 9 is E. A full-tone bend at fret 7 aims for E, not E♭. Play fret 9 first, then bend fret 7 until the pitches match. The journey toward a note is part of the phrase.'],
['Two names for one pitch','C♯ and D♭ sound alike on a standard fretted guitar, but their spelling shows different musical relationships. A major scale uses each letter once. That is why G major uses F♯, rather than G♭.']],play:'Name the open strings. On the G string, play D–E♭–E at frets 7–8–9, then compare the half-step and whole-step bends.',answer:'A tone spans two frets. A semitone spans one. D bent a tone reaches E.'},
majorfoundation:{title:'2 · Build and learn major scales',sections:[
['A recipe you can move','The major-scale step pattern is whole–whole–half–whole–whole–whole–half: 2–2–1–2–2–2–1 frets. Starting on C produces C–D–E–F–G–A–B–C. Numbers 1 through 7 name positions in the scale, not frets.'],
['Why A major has sharps','Starting on A and following the same distances produces A–B–C♯–D–E–F♯–G♯–A. C♯ is the third and G♯ the seventh. C natural and G natural are lowered versions of those degrees.'],
['A manageable learning path','Start with C: say its notes, play them, and build chords from them. Then learn G (F becomes F♯), D (add C♯), and A (add G♯). Also learn F, which introduces B♭. You are learning relationships, while gradually recalling note names more quickly.'],
['Key versus scale','A scale is an ordered note collection. A key describes a musical home and the relationships around it. A song in a key can use notes and chords outside its major scale. Blues is a useful example.']],play:'Choose C in the explorer. Play C major slowly on one string, following the step recipe. Sing the notes, then repeat in G. Say which note changed.',answer:'G major changes F to F♯; the interval pattern stays the same.'},
intervalfoundation:{title:'3 · Intervals: major, minor, perfect, diminished',sections:[
['Count letters, then measure distance','C to E is some kind of third because C–D–E spans three letter names. C to E♭ is also a third, but it is smaller. The letter count gives the interval number; the semitone count determines its quality.'],
['The reference is the root’s major scale','From C: 1=C, 2=D, 3=E, 4=F, 5=G, 6=A, 7=B. Major seconds, thirds, sixths and sevenths become minor when lowered one semitone. Perfect unisons, fourths, fifths and octaves become diminished when narrowed one semitone. A minor interval narrowed again becomes diminished.'],
['Flat does not mean diminished','C–B is a major seventh (11 semitones). C–B♭ is a minor seventh (10). C–B♭♭ is a diminished seventh (9). By contrast C–G is a perfect fifth (7), so C–G♭ is already a diminished fifth (6). A ♭ in a formula means lower that major-scale degree one semitone; the resulting interval name depends on the degree.'],
['Spelling preserves the relationship','C–A is a major sixth. C–B♭♭ is a diminished seventh. They sound alike on this guitar, but the letter names describe different roles. You do not need double flats everywhere; they explain why a diminished seventh is named as it is.']],play:'On the B string play C at fret 1, then E♭ at 4 and E at 5. Hear minor versus major thirds. Compare G at 8 and G♭ at 7 for perfect versus diminished fifths.',answer:'A flattened seventh is minor, while a flattened perfect fifth is diminished.'},
chordfoundation:{title:'4 · Construct major, minor and diminished triads',sections:[
['A triad has three distinct notes','A major triad uses 1–3–5 of its root’s major scale. C major is C–E–G; A major is A–C♯–E. Strumming five or six strings can still produce a triad because some notes repeat.'],
['Change the third to change the quality','A minor triad is 1–♭3–5. C minor is C–E♭–G; A minor is A–C–E. The major third spans four semitones above the root, the minor third three.'],
['What makes a diminished triad','A diminished triad is 1–♭3–♭5. C diminished is C–E♭–G♭. Compared with minor, its fifth is lowered. Root to diminished fifth spans six semitones, the tritone. A dominant seventh chord can contain a tritone without being a diminished chord.'],
['A formula uses the chord root','D minor in C major contains D–F–A. Relative to the KEY these are degrees 2–4–6. Relative to D’s major scale, they are 1–♭3–5. Keep key degrees and chord intervals distinct.']],play:'Use the explorer to compare C major, C minor and C diminished. Say the changed note before listening. Then find C–E–G on the top three strings.',answer:'C major → minor lowers E to E♭. Minor → diminished lowers G to G♭.'},
diatonicfoundation:{title:'5 · The seven chords inside a major key',sections:[
['Stack every other scale note','In C major, begin on C and take C–E–G. Begin on D and take D–F–A. Continue using only C-major notes, wrapping around when needed. This produces the diatonic triads.'],
['The pattern in every major key','I major, ii minor, iii minor, IV major, V major, vi minor, vii° diminished. In C: C, Dm, Em, F, G, Am, Bdim. Uppercase means major; lowercase means minor; ° indicates diminished. The seventh-degree chord is a three-note triad, not automatically a seventh chord.'],
['Two kinds of numbers','The vii° tells you the root’s position in the key. The 7 in A7 tells you the chord includes a seventh above A. Those are different jobs. A7 can appear in a song without being its seventh-degree chord.'],
['Why some chords are minor','D–F spans three semitones, while C–E spans four. The major scale’s unequal spacing generates different triad qualities when you stack thirds. The chord names follow the actual intervals.']],play:'Select C, then choose each degree in the explorer. Say its three notes and chord quality before revealing the selection. Strum C–Am–F–G and target each chord’s third with a melody.',answer:'C: C–E–G; Dm: D–F–A; Em: E–G–B; F: F–A–C; G: G–B–D; Am: A–C–E; Bdim: B–D–F.'},
seventhfoundation:{title:'6 · Seventh chords and extensions',sections:[
['Add another third','A seventh chord extends a triad with a fourth distinct note. Major seventh: 1–3–5–7. Dominant seventh: 1–3–5–♭7. Minor seventh: 1–♭3–5–♭7. The unqualified symbol A7 means dominant seventh, not Amaj7.'],
['Your A7 example','A major is A–C♯–E. Its major-scale seventh is G♯. A7 adds G natural, the minor seventh, giving A–C♯–E–G. Amaj7 uses G♯. Am7 uses C natural and G natural.'],
['Half diminished versus fully diminished','B–D–F is Bdim. Add A to get Bm7♭5 (B half-diminished seventh): 1–♭3–♭5–♭7. Add A♭ instead to get Bdim7: 1–♭3–♭5–♭♭7. B major’s seventh is A♯, so lowering twice gives A♭. Bm7♭5 belongs to C major; Bdim7 does not consist solely of C-major notes.'],
['Why ninth and eleventh?','Keep counting beyond the octave: 8 repeats the root, 9 corresponds to 2, 11 to 4 and 13 to 6. An A9 chord conventionally includes the dominant seventh plus B: A–C♯–E–G–B, with practical omissions possible. Aadd9 adds B to an A triad without implying G. Extensions describe harmonic structure; a guitar voicing need not place every note in ascending order.']],play:'Compare A major, A7, Amaj7 and Am7 in the explorer. Listen for what changes as the third or seventh changes.',answer:'A7’s G is a minor seventh. “Diminished” is an interval or chord quality, not a synonym for a flat sign.'},
voicingfoundation:{title:'7 · Why a chord shape works: the A7 lab',sections:[
['The notes explain the shape','Open A7 x02020 sounds A–E–G–C♯–E. The repeated E is fine: all four chord tones appear. Open A major x02220 sounds A–E–A–C♯–E. Opening the G string replaces that A with G.'],
['Your alternative works','x02223 produces A–E–A–C♯–G. You kept the usual A shape and changed the thin E string to G at fret 3. Same chord, different arrangement of notes: a different voicing. Try a second-fret barre across D, G and B with another finger on high E fret 3. Keep low E muted.'],
['When G becomes the bass','302220 and 302223 have G as their lowest note. They are A7/G: A7 with G in the bass, also called third inversion. A slash names the bass note; it does not mean a different set of chord tones is required. Lowest pitch, rather than leftmost written chord tone, determines the bass.'],
['Do all four notes always have to appear?','A complete A7 contains A, C♯, E and G. In an ensemble, guitarists can omit the fifth, or sometimes the root supplied by the bass. C♯ and G strongly identify the dominant-seventh color. Context matters: a partial voicing is less unambiguous by itself.']],play:'Choose each shape below, inspect the string-by-string notes, and strum it on your guitar. Compare G inside the chord, G on top and G in the bass.',answer:'A chord’s identity comes from its notes and context. Its voicing describes their arrangement; its inversion depends on the lowest note.'},
bluesfoundation:{title:'8 · Why the blues lick works',sections:[
['A minor pentatonic over A7','A minor pentatonic contains A–C–D–E–G: 1–♭3–4–5–♭7. A7 contains A–C♯–E–G. A, E and G are shared chord tones. C and D introduce other colors.'],
['The bend has a destination','Bending D at G-string fret 7 up a whole tone reaches E, the fifth of A. Compare directly playing E with approaching it in a bend. Pitch movement, rhythm, attack, vibrato and space help make a phrase expressive.'],
['The minor and major thirds coexist','C natural against A7’s C♯ creates a characteristic blues tension. Blues phrasing often shades pitch around the minor and major thirds rather than treating the scale as a rigid permission list. A small bend of C is not automatically a precise C♯; hear and control the intended pitch.'],
['Follow the actual chord','In an A blues, D7 contains D–F♯–A–C, so C becomes a chord tone. E7 contains E–G♯–B–D, so D becomes a chord tone. The same lick’s notes change their roles as the harmony moves. The blues scale adds E♭ to A minor pentatonic, but the full-tone D-to-E bend does not stop at E♭.']],play:'Loop A7. Play C, D, E and G slowly. Compare their pull and stability, then bend D to E. Repeat over D7 and notice how C changes its role.',answer:'The lick combines shared chord tones, blues tension and expressive motion. Its effect depends on the harmony, timing and articulation.'},
fretfoundation:{title:'9 · Fretboard, CAGED and arpeggios',sections:[
['One set of notes, many locations','An octave repeats the same note name twelve frets higher. Standard tuning is mostly fourths, but G to B is a major third. Shapes crossing that pair adjust by one fret. Learn notes on all strings gradually instead of assuming one pattern translates unchanged everywhere.'],
['CAGED connects movable forms','C, A, G, E and D refer to five familiar major-chord forms. Move a form while replacing open strings with fretted notes, and its chord name changes with its root. The A form is not always an A chord. Some full shapes are awkward; smaller fragments are often more practical.'],
['Triads and arpeggios reveal targets','A triad is a three-note chord. An arpeggio plays chord tones individually, often across more than one octave. A scale surrounds those targets with additional notes. Learn where root, third and fifth sit inside each region, then connect nearby regions.'],
['Build fluency rather than reciting','Say a note, find it, play it and hear its role over a chord. Practice small groups on adjacent strings. Link the same note in several places, then use a short musical phrase. Speed of recall grows through use.']],play:'Use the existing Triad Trainer to find C–E–G in two areas. Over a C loop, improvise with just those notes, then add D as a passing note.',answer:'CAGED organizes chord forms and related note locations. Knowing the roots and chord tones makes the patterns musically useful.'},
practicefoundation:{title:'10 · Turn theory into daily musicianship',sections:[
['Four connected actions','Identify: name the scale and chord notes. Locate: find them on your guitar. Construct: change a note to build a new chord. Hear: compare its sound and use it in a phrase. A correct verbal answer is a beginning; playing and listening complete the exercise.'],
['A thirty-minute session','Five minutes: name notes and warm up. Seven: build one scale and two chords. Eight: find and play their tones in two neck regions. Eight: loop a progression and improvise short phrases. Two: explain what changed and what still puzzles you. For fifteen minutes, split the session and continue next time.'],
['Start small and stay musical','Begin in C major, then G, D, A and F. Alongside this, keep playing A blues. Choose one question per session: why is this chord minor, what changed in A7, or where is the next chord’s third? Keep working on songs you enjoy.'],
['Use questions like this conversation','Ask “Why does this shape work?” or “What changes if I move this one note?” Predict, play, listen and revise. The app’s conversation tools can carry your selected theory topic into a follow-up discussion. Treat self-marked completion as practice history, not proof of mastery.']],play:'Pick one chord you already know. Name each sounding string, derive the chord formula, change one note, and explain the new sound before checking.',answer:'Understanding grows when predictions meet the sound of the instrument.'}
};

function lowerSpelling(n,amount){const letters='CDEFGAB',natural={C:0,D:2,E:4,F:5,G:7,A:9,B:11};const l=n[0];let alteration=0;for(const a of n.slice(1))alteration+=a==='#'?1:a==='b'?-1:0;alteration+=amount;return l+(alteration<0?'♭'.repeat(-alteration):'♯'.repeat(alteration));}

function coachJsonp(action,id){
 return new Promise((resolve,reject)=>{
  const callback='ffAI_'+Math.random().toString(36).slice(2),scr=document.createElement('script');
  let done=false;
  const timeout=setTimeout(()=>finish(null,Error('No response from Apps Script; confirm you deployed the new version')),12000);
  function finish(data,error){if(done)return;done=true;clearTimeout(timeout);delete window[callback];scr.remove();error?reject(error):resolve(data)}
  window[callback]=data=>finish(data,null);
  scr.onerror=()=>finish(null,Error('Unable to reach Apps Script'));
  scr.src=cloud.url+'?action='+action+'&key='+encodeURIComponent(cloud.key)+'&id='+encodeURIComponent(id)+'&callback='+callback+'&t='+Date.now();
  document.head.appendChild(scr);
 });
}
function coachWait(ms){return new Promise(resolve=>setTimeout(resolve,ms))}

async function checkCoachConnection(){
 const status=$('coachStatus');
 if(!status)return;
 if(!cloud.url){status.textContent='⚠ No Apps Script web app URL configured. Open Progress to connect it.';return}
 if(!safeKey(cloud.key)){status.textContent='⚠ No valid private profile code on this device. Open Progress and connect your profile code. Until then, Ask coach will not send a request.';return}
 status.textContent='Checking the Apps Script deployment and your profile…';
 const callback='ffLoad_'+Math.random().toString(36).slice(2);
 const node=document.createElement('script');
 let finished=false;
 const timer=setTimeout(()=>done(null,'No reply after 15 seconds. Check deployment URL and web-app access setting (Anyone).'),15000);
 function done(value,error){
  if(finished)return;finished=true;clearTimeout(timer);node.remove();try{delete window[callback]}catch{}
  const box=$('coachStatus');if(!box)return;
  if(error)box.textContent='⚠ '+error;
  else if(!value||!value.ok)box.textContent='⚠ Apps Script replied: '+String(value?.error||'unknown error');
  else if(!value.state)box.textContent='✓ Apps Script responds, but this profile is not saved yet. Open Progress → Backup now, then Restore from Sheets and try again.';
  else box.textContent='✓ Apps Script responded and found your profile. Now try Ask coach. This test does not call OpenAI.';
 }
 window[callback]=value=>done(value,null);
 node.onerror=()=>done(null,'The Apps Script URL could not be loaded. Check your deployment access and URL.');
 node.src=cloud.url+'?action=load&key='+encodeURIComponent(cloud.key)+'&callback='+callback+'&t='+Date.now();
 document.head.appendChild(node);
}

async function sendCoachQuestion(thread){
 if(coachBusy)return;
 const input=$('coachQuestion'),question=(input?.value||'').trim();
 if(!question)return;
 if(!cloud.url||!safeKey(cloud.key)){const status=$('coachStatus');if(status)status.textContent='⚠ No valid profile connection. Open Progress and connect the deployed Apps Script URL and your private profile code. No request has been sent.';return}
 const history=(coachThreads()[thread]||[]).slice(-6);
 coachBusy=true;
 const context=coachContext(),id='ff'+Date.now().toString(36)+Math.random().toString(36).slice(2,14);
 const status=$('coachStatus');if(status)status.textContent='Sending the question to Apps Script…';
 if($('coachSend'))$('coachSend').disabled=true;
 try{
  const payload={action:'aiAsk',id,key:cloud.key,question,context:JSON.stringify(context),history};
  // no-cors POST: the JSON response cannot be read; poll a JSONP GET for the finished answer.
  await fetch(cloud.url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
  if($('coachStatus'))$('coachStatus').textContent='Request sent; waiting for AI reply from Apps Script…';
  let answer=null;
  for(let attempts=0;attempts<18;attempts++){
   await coachWait(2500);
   const result=await coachJsonp('aiPoll',id);
   if(result&&!result.pending){if(!result.ok)throw Error(result.error||'AI request failed');answer=result.answer;break}
  }
  if(!answer)throw Error('The coach did not respond in time. Try again or check the Apps Script deployment.');
  const list=coachThreads()[thread]||[];
  list.push({role:'user',content:question},{role:'assistant',content:String(answer)});
  coachThreads()[thread]=list.slice(-8).map(m=>({role:m.role,content:m.content.slice(0,1300)}));
  // cap retained sessions so cloud backup remains within Google Sheets payload limits
  while(Object.keys(coachThreads()).length>7)delete coachThreads()[Object.keys(coachThreads())[0]];
  save();
  renderCoach();
 }catch(err){
  const el=$('coachStatus');if(el)el.textContent='⚠ '+String(err.message||err)+' — check Apps Script Executions and deployment settings. Your question remains in the box.';
 }finally{coachBusy=false;const b=$('coachSend');if(b)b.disabled=false}
}

function surpriseState(){if(!state.surpriseLicks)state.surpriseLicks={decks:{bluegrass:[],blues:[]},last:{bluegrass:-1,blues:-1},current:null,history:[]};return state.surpriseLicks}
function surpriseNext(style){
 const st=surpriseState(),items=SURPRISE_LICKS[style];if(!items)return;
 if(!st.decks[style]?.length){
  const deck=items.map((_,i)=>i);
  for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}
  if(deck[0]===st.last[style]&&deck.length>1)[deck[0],deck[1]]=[deck[1],deck[0]];
  st.decks[style]=deck;
 }
 const i=st.decks[style].shift();
 st.last[style]=i;st.current={style,index:i,at:Date.now()};
 st.history.unshift({style,index:i,at:Date.now()});st.history=st.history.slice(0,25);
 save();renderSurprise();
}
function renderSurprise(){
 const prior=$('surpriseLicks');if(prior)prior.remove();
 if(page!=='home'&&page!=='studio')return;
 const current=surpriseState().current;
 const lesson=current&&SURPRISE_LICKS[current.style]?.[current.index];
 const card=lesson?'<div class="theory-mini"><div class="eyebrow">'+(current.style==='bluegrass'?'Acoustic · Bluegrass':'Electric · Blues')+' · Surprise pick</div>'+
 '<h3>'+escapeHtml(lesson.title)+'</h3><p class="muted small">'+escapeHtml(lesson.creator)+' · '+escapeHtml(lesson.focus)+'</p>'+
 '<p><strong>Try this:</strong> '+escapeHtml(lesson.task)+'</p>'+
 '<p class="small"><strong>Theory connection:</strong> '+escapeHtml(lesson.theory)+'</p>'+
 '<div class="controls"><a href="'+lesson.url+'" target="_blank" rel="noopener noreferrer" style="display:inline-block;border-radius:8px;background:#267e74;color:#fff;padding:11px;text-decoration:none;font-weight:700">▶ Learn this lick ↗</a><button data-surprise-style="'+current.style+'">↻ Another '+current.style+' pick</button></div>'+
 '</div>':'<p class="small muted">Get a real lesson link plus a musical challenge. You can keep clicking for different lessons; the app avoids repeats until it has shown the full set.</p>';
 const html='<div class="panel" id="surpriseLicks"><div class="eyebrow">Discovery · 5-minute musical adventure</div><h2>🎲 Surprise Me: Learn a Lick</h2>'+
 '<p>Learn the lick, identify its notes, and then change the ending, rhythm, or key so it becomes your own musical vocabulary.</p>'+
 '<div class="controls"><button class="primary" data-surprise-style="bluegrass">🪕 Surprise Me · Bluegrass</button><button class="primary" data-surprise-style="blues">🎸 Surprise Me · Blues</button></div>'+card+
 '<p class="small muted">Curated links to real instructor lessons. A new click selects another item in that style; after the pool is exhausted, it reshuffles. External lessons may offer optional paid resources.</p></div>';
 app.insertAdjacentHTML('afterbegin',html);
}

ow</button><button id="cloudrestore">Restore from Sheets</button></div><p id="clouderror" class="small"></p><p class="small muted"><strong>Apps Script configuration:</strong> Add a Script Property named <code>SPREADSHEET_ID</code> (not <code>SHEET_ID</code>) with only the ID from your Google Sheets URL. The spelling matters because the Apps Script code specifically requests <code>SPREADSHEET_ID</code>. Keep your <code>OPENAI_API_KEY</code> Script Property for the AI Coach.</p><p class="small muted">Keep your profile code private. Anyone with the same code and endpoint can access that profile. Google Sheets stores the progress; no Google sign-in appears inside this app. A sent backup cannot be independently confirmed by this HTML due to cross-origin restrictions; use Restore from Sheets to verify it.</p></div><button id="reset">Reset all progress</button></div>`;$('sound').onchange=e=>{state.settings.sound=e.target.checked;save()};$('cloudurl').value=cloud.url;$('cloudkey').value=cloud.key;updateCloudLabel();$('makekey').onclick=()=>{$('cloudkey').value=generateKey();$('clouderror').textContent='Save this code somewhere safe so you can use it on your other device.'};$('connectcloud').onclick=()=>{$('clouderror').textContent=setCloudConfig($('cloudurl').value,$('cloudkey').value)};$('cloudbackup').onclick=()=>{cloudLastUpload=0;syncCloud(true);updateCloudLabel()};$('cloudrestore').onclick=loadCloud;$('reset').onclick=()=>{if(confirm('Delete all local Fretboard Freedom progress on this browser?')){state=structuredClone(DEFAULT);state.updatedAt=Date.now();persistLocal();cloudStatus='Local progress reset. Cloud backup is retained until your next backup or sync.';progress()}}}
