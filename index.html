<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b28"><title>Fretboard Freedom — Guitar Theory Lab</title><style>
:root{--bg:#0d1621;--panel:#182636;--panel2:#213447;--line:#35485c;--ink:#f1f5f7;--muted:#b6c7d3;--teal:#48c1b3;--orange:#ffa969;--red:#ff8d91;--gold:#ffdc89}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#23384a 0,var(--bg) 55%);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer;background:#284257;color:var(--ink);border:1px solid #526a7d;border-radius:11px;padding:10px 14px}button:hover{background:#38546b}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}button.primary{background:#177d79;border-color:#39b7a9;font-weight:700}button.primary:hover{background:#199d93}button:disabled{opacity:.5;cursor:not-allowed}button.active{background:#136d70;border-color:var(--teal)}select,input{background:#101e2c;color:var(--ink);border:1px solid #688093;border-radius:9px;padding:9px}header{border-bottom:1px solid var(--line);background:#101c29eb;position:sticky;top:0;z-index:10;backdrop-filter:blur(12px)}.top{max-width:1170px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;gap:15px;flex-wrap:wrap}.brand{font-weight:850;letter-spacing:.3px;font-size:1.2rem}.brand span{color:var(--teal)}nav{display:flex;gap:7px;flex-wrap:wrap}nav button{border:0;background:transparent;font-size:.9rem;padding:8px 12px}nav button.active{background:#2a4657}main{max-width:1170px;margin:auto;padding:27px 18px 65px}.panel{background:linear-gradient(145deg,#192a3a,#162433);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 12px 30px #0002}.panel.soft{background:#152333}.eyebrow{color:var(--teal);font-size:.76rem;letter-spacing:2px;text-transform:uppercase;font-weight:800}h1{font-size:clamp(1.75rem,4vw,2.8rem);line-height:1.12;margin:8px 0 14px}h2{margin:0 0 14px;font-size:1.45rem}h3{margin:0 0 7px;font-size:1.12rem}p{margin:9px 0;color:#dfebf0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.stat{padding:17px;background:#213647;border-radius:13px}.stat b{display:block;font-size:1.8rem;color:var(--orange)}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}.tag{display:inline-block;background:#284b52;border:1px solid #317f7b;color:#d8fffa;font-size:.78rem;padding:3px 9px;border-radius:99px}.note{padding:14px 16px;background:#203747;border-left:4px solid var(--teal);border-radius:9px;margin:16px 0}.warning{border-left-color:var(--orange)}.lesson{max-width:850px}.lesson section{padding-bottom:13px;border-bottom:1px solid #354758;margin-bottom:23px}.lesson h3{color:var(--gold)}.fbscroll{overflow-x:auto;overscroll-behavior-x:contain;margin:15px 0}.fretboard{width:100%;min-width:650px;display:block;touch-action:manipulation;background:#132231;border-radius:10px}.fret-hit{cursor:pointer}.fret-hit:focus{outline:none}.fret-hit:focus circle.hitbox{stroke:var(--gold);stroke-width:3}.feedback{padding:13px;border-radius:12px;background:#263a4c;margin:12px 0;min-height:49px}.feedback.ok{background:#164b43;color:#d7fff5}.feedback.bad{background:#553238;color:#fff0eb}.scoreline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.scoreline strong{color:var(--gold)}.choices{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.choices button{min-width:52px}.pill{background:#30475b;border-radius:99px;padding:5px 12px;color:#e8f1f5}.small{font-size:.88rem}.hidden{display:none}.progress{height:9px;border-radius:99px;overflow:hidden;background:#314457;margin-top:8px}.bar{background:var(--teal);height:100%;width:0}.task{padding:14px;border-radius:12px;background:#213747;margin-bottom:8px}.task.done{border-left:4px solid var(--teal)}.layout2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:700px){.layout2{grid-template-columns:1fr}.panel{padding:16px}nav button{padding:7px}.top{padding:10px 15px}main{padding:18px 12px </style></head><body><header><div class="top"><div class="brand">🎸 <span>Fretboard</span> Freedom</div><nav id="nav"><button data-page="home">Dashboard</button><button data-page="learn">Learn</button><button data-page="games">Games</button><button data-page="jam">Practice Studios</button><button data-page="progress">Progress</button></nav></div></header><main id="app"></main><script>
'use strict';
const N=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];const OPEN=[4,11,7,2,9,4];const MIDI_OPEN=[64,59,55,50,45,40];const MAJOR=[0,2,4,5,7,9,11];const SHARP={Db:'C#',Eb:'D#',Gb:'F#',Ab:'G#',Bb:'A#'};const mod=(n,m)=>((n%m)+m)%m;const pitch=(s,f)=>mod(OPEN[s-1]+f,12);const name=(s,f)=>N[pitch(s,f)];const pc=n=>N.indexOf(SHARP[n]||n);const noteAnswer=(s,f,a)=>pc(a)===pitch(s,f);const rand=n=>Math.floor(Math.random()*n);const pick=a=>a[rand(a.length)];const escapeHtml=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MAJOR_TRIADS=[["C",0,["C","E","G"]],["Db",1,["Db","F","Ab"]],["D",2,["D","F#","A"]],["Eb",3,["Eb","G","Bb"]],["E",4,["E","G#","B"]],["F",5,["F","A","C"]],["Gb",6,["Gb","Bb","Db"]],["G",7,["G","B","D"]],["Ab",8,["Ab","C","Eb"]],["A",9,["A","C#","E"]],["Bb",10,["Bb","D","F"]],["B",11,["B","D#","F#"]]];
const STORAGE='fretboardFreedom.v1',CLOUD_CONFIG='fretboardFreedom.cloud.v1';
const DEFAULT={xp:0,correct:0,attempts:0,streak:0,best:0,lesson:0,completed:[],history:[],settings:{sound:true},location:{page:'home',lesson:null,mode:'find'},updatedAt:0};
let state;try{state={...structuredClone(DEFAULT),...JSON.parse(localStorage.getItem(STORAGE)||'{}')}}catch{state=structuredClone(DEFAULT)};
state.location=state.location||structuredClone(DEFAULT.location);state.settings=state.settings||{sound:true};
let cloud={url:'https://script.google.com/macros/s/AKfycbzZNsJOW2tX74VnQrzPaHnx5oSz_mujbHfEdz732mhsQ2ZsyknaXZQK-zaDvZIt99Ka/exec',key:''};try{cloud={...cloud,...JSON.parse(localStorage.getItem(CLOUD_CONFIG)||'{}')}}catch{}
let cloudTimer=null,cloudBusy=false,cloudStatus='Local saving active',cloudLastUpload=0,cloudLastResult='';
function persistLocal(){try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch(e){cloudStatus='Local save unavailable: browser storage blocked'}}
function save(){state.updatedAt=Date.now();persistLocal();scheduleCloud()}
function scheduleCloud(){if(!cloud.url||!cloud.key)return;clearTimeout(cloudTimer);cloudTimer=setTimeout(syncCloud,1100)}
function cleanUrl(u){u=String(u||'').trim();return /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec(?:\?.*)?$/.test(u)?u.split('?')[0]:''}
function safeKey(k){return /^[A-Za-z0-9_-]{16,90}$/.test(String(k||''))}
function generateKey(){if(window.crypto&&crypto.getRandomValues){const a=new Uint8Array(24);crypto.getRandomValues(a);return Array.from(a,n=>n.toString(16).padStart(2,'0')).join('')}return ''}
function syncCloud(force=false){if(!cloud.url||!safeKey(cloud.key)||cloudBusy)return;if(!force && state.updatedAt<=cloudLastUpload)return;cloudBusy=true;const at=state.updatedAt;cloudStatus='Sending backup…';const payload={action:'save',key:cloud.key,state:state};fetch(cloud.url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),keepalive:true}).then(()=>{cloudLastUpload=at;cloudStatus='Backup sent · verify with Restore from Sheets';cloudLastResult='POST sent; confirmation requires reading the saved record.';}).catch(()=>{cloudStatus='Cloud unavailable · progress remains saved locally';cloudLastResult='Upload failed; try Backup now again.'}).finally(()=>{cloudBusy=false;if(state.updatedAt>at)scheduleCloud();updateCloudLabel()})}
function loadCloud(){if(!cloud.url||!safeKey(cloud.key)){cloudStatus='Enter a valid Apps Script URL and profile code';updateCloudLabel();return}cloudStatus='Checking Google Sheets…';updateCloudLabel();const callback='ffLoad_'+Math.random().toString(36).slice(2);const script=document.createElement('script');let finished=false;const timer=setTimeout(()=>done({ok:false,error:'Google Sheets did not respond. Check your deployment and URL.'}),14000);function done(data){if(finished)return;finished=true;clearTimeout(timer);delete window[callback];script.remove();if(!data||!data.ok){cloudStatus='Cloud load failed: '+String(data&&data.error||'unknown error');updateCloudLabel();return}if(!data.state){cloudStatus='No existing cloud backup for this profile · local progress retained';updateCloudLabel();scheduleCloud();return}const remote=data.state;if(!remote || !Array.isArray(remote.history) || !Array.isArray(remote.completed) || !Number.isFinite(Number(remote.updatedAt))){cloudStatus='Unexpected cloud data; local progress retained';updateCloudLabel();return}const localTime=Number(state.updatedAt)||0,remoteTime=Number(remote.updatedAt)||0;if(remoteTime>localTime){state={...structuredClone(DEFAULT),...remote};state.location=state.location||structuredClone(DEFAULT.location);state.settings=state.settings||{sound:true};persistLocal();cloudLastUpload=remoteTime;cloudStatus='Cloud progress restored';render();}else{cloudStatus='Local progress is current';if(localTime>remoteTime)scheduleCloud()}updateCloudLabel()}window[callback]=done;script.onerror=()=>done({ok:false,error:'Unable to load script'});script.src=cloud.url+'?action=load&key='+encodeURIComponent(cloud.key)+'&callback='+callback+'&t='+Date.now();document.head.appendChild(script)}
function updateCloudLabel(){for(const el of document.querySelectorAll('[data-cloud-status]'))el.textContent=cloudStatus}
function setCloudConfig(url,key){const valid=cleanUrl(url);if(!valid||!safeKey(key))return 'Use a deployed Google Apps Script /exec URL and a profile code of 16–90 letters/numbers.';cloud={url:valid,key:key};localStorage.setItem(CLOUD_CONFIG,JSON.stringify(cloud));cloudLastUpload=0;loadCloud();return ''}
let page='home',mode='find',question=null,selected=new Set(),lastFeedback='',answerLocked=false,gameRound=0,jamChord=0,jamRunning=false,jamTimer=null,audio=null;const $=id=>document.getElementById(id);const app=$('app');
window.addEventListener('pagehide',()=>{persistLocal();if(cloud.url&&cloud.key&&state.updatedAt>cloudLastUpload)syncCloud(true)});
window.addEventListener('online',()=>{loadCloud()});

function go(p){stopJam();page=p;state.location={page:p,lesson:null,mode:mode};save();document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();window.scrollTo({top:0,behavior:'instant'})}document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
function audioCtx(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}function tone(midi,dur=.7,at=0,vol=.14,type='sine'){if(!state.settings.sound)return;let c=audioCtx(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime+at;o.type=type;o.frequency.value=440*Math.pow(2,(midi-69)/12);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.03)}function chord(root,quality='major',dur=1.1,delay=0){let base=48+root;[0,quality==='minor'?3:4,7].forEach((n,i)=>tone(base+n,dur,delay+i*.04,.075,'triangle'))}function feedback(text,ok){const el=$('feedback');if(el){el.className='feedback '+(ok===true?'ok':ok===false?'bad':'');el.innerHTML=text}}function record(ok,label){state.attempts++;if(ok){state.correct++;state.streak++;state.best=Math.max(state.streak,state.best);state.xp+=state.streak%5===0?125:100}else state.streak=0;state.history.push({at:Date.now(),ok,label});state.history=state.history.slice(-200);save()}
function fretboard(opts={}){let {show='none',clickable=true,range=12,highlights=[],start=0,triadRoot=0,triadNames=['C','E','G']}=opts;const w=940,h=255,lo=start,hi=Math.min(12,start+range),step=65;let svg=`<div class="fbscroll"><svg class="fretboard" viewBox="0 0 ${w} ${h}" role="group" aria-label="Interactive guitar fretboard. Strings shown high E at top to low E at bottom.">`;for(let f=lo;f<=hi;f++){let x=77+(f-lo)*step;svg+=`<text x="${x}" y="25" fill="#b6c7d3" text-anchor="middle" font-size="15">${f||'open'}</text>`}for(let f=lo;f<hi;f++){let x=110+(f-lo)*step;svg+=`<line x1="${x}" y1="50" x2="${x}" y2="210" stroke="#667e8c" stroke-width="${f===0?5:2}" opacity=".6"/>`}for(let s=1;s<=6;s++){let y=62+(s-1)*29;svg+=`<line x1="34" y1="${y}" x2="${110+(hi-lo)*step}" y2="${y}" stroke="#b9a78d" stroke-width="${1+s*.37}"/><text x="18" y="${y+5}" fill="#d2dce2" font-size="15" text-anchor="middle">${['e','B','G','D','A','E'][s-1]}</text>`;for(let f=lo;f<=hi;f++){let x=77+(f-lo)*step,id=`${s}:${f}`,n=pitch(s,f),highlight=highlights.some(a=>a.s===s&&a.f===f),triadOffsets=[0,4,7],triadIndex=triadOffsets.indexOf((n-triadRoot+12)%12),visible=highlight||(show==='all')||(show==='cmajor'&&MAJOR.includes(n))||(show==='ctriad'&&[0,4,7].includes(n))||(show==='majortriad'&&triadIndex>=0),fill=(show==='majortriad'?n===triadRoot:n===0)?'#e7a16f':'#49bfb2',txt=show==='majortriad'&&triadIndex>=0?triadNames[triadIndex]:show==='ctriad'?[0,4,7].includes(n)?['1','3','5'][[0,4,7].indexOf(n)]:'':N[n];if(highlight){fill='#ffd88d';txt=N[n]}svg+=`<g class="${clickable?'fret-hit':''}" ${clickable?`tabindex="0" role="button" aria-label="String ${s} fret ${f}, ${visible?N[n]:'hidden note'}" data-s="${s}" data-f="${f}"`:''}><circle class="hitbox" cx="${x}" cy="${y}" r="15" fill="${visible?fill:'transparent'}" stroke="${selected.has(id)?'#fff5bd':visible?'#0a1824':'#6a7c85'}" stroke-width="${selected.has(id)?4:visible?1:.25}"/><text x="${x}" y="${y+5}" fill="${visible?'#09202b':'transparent'}" font-weight="bold" font-size="${txt.length>2?11:13}" text-anchor="middle">${visible?escapeHtml(txt):'·'}</text></g>`}}svg+='</svg></div>';return svg}
function attachFret(cb){document.querySelectorAll('.fret-hit').forEach(g=>{function action(){cb(+g.dataset.s,+g.dataset.f)}g.addEventListener('click',action);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();action()}})})}
const lessonData=[{title:'The musical alphabet and your fretboard',source:'JustinGuitar Grade 1; Grade 2',parts:[['A guitar has 12 repeating pitch classes','Western equal-tempered tuning divides an octave into 12 semitones. The natural note letters are A B C D E F G, and then they repeat. The adjacent natural pairs B–C and E–F are only one semitone apart; most other adjacent letter names are two semitones apart.'],['Sharps, flats, and enharmonic names','A sharp raises a note by one semitone; a flat lowers it by one semitone. C# and Db can name the same sounding pitch in equal temperament; the appropriate spelling depends on the harmonic context. One fret along the same guitar string equals one semitone.'],['Know your six open strings','From thickest (string 6) to thinnest (string 1), standard tuning is E–A–D–G–B–E. The first and sixth strings share note names at identical fret numbers, two octaves apart.'],['Calculate any note','Start from the open string note and advance one semitone per fret. Example: string 4 is open D; fret 1 is Eb, fret 2 is E, fret 3 is F, fret 5 is G, and fret 7 is A. The twelfth fret repeats the open-string note an octave higher.'],['Make the knowledge musical','Pick a C on your guitar. Play it, hum it, then find another C on a different string. Play both. Repeat for G and A. The goal is to recognize the locations without counting each fret.']]},{title:'Intervals, octaves, and musical distance',source:'JustinGuitar Grades 1, 3 and Grade 4 Module 3; added practical interval exercises',parts:[['An interval measures distance between pitches','A semitone is a one-fret step; a whole tone is two frets. Intervals also have degree names. From C, D is a major second (2 semitones), E is a major third (4), F is a perfect fourth (5), G is a perfect fifth (7), and the higher C is an octave (12).'],['Intervals stay the same when the key changes','The root-to-major-third relationship is always four semitones, whether C to E, G to B, or A to C#. Instead of memorizing isolated note pairs, you can learn the musical distance and apply it anywhere.'],['Octave patterns connect the neck','An octave is 12 semitones higher. From string 6 fret 3 (G), another G lies on string 4 fret 5. From string 5 fret 3 (C), the octave is on string 3 fret 5. Crossing the G-to-B tuning irregularity changes some octave shapes: from string 4 fret 3 (F) to string 2 fret 6 (F).'],['Major and minor thirds change the feeling of a chord','C–E is a major third (four semitones), while C–Eb is a minor third (three). In a C chord, changing the third from E to Eb turns C major into C minor when the root and fifth remain unchanged.'],['Use intervals to improvise','Over C major, target C, E, or G. Over F major, target F, A, or C. F belongs to the C major scale, but the stronger explanation for landing on it when the chord changes is that F is the root of the new chord. Practice hearing the difference.']]}];
function render(){if(page==='studio')studio();if(page==='home')home();if(page==='learn')learn();if(page==='games')games();if(page==='jam')jam();if(page==='progress')progress()}
function home(){app.innerHTML=`<div class="panel"><div class="eyebrow">Guitar theory lab · Prototype 1.1</div><h1>Learn it. See it.<br><span class="glow">Hear it. Play it.</span></h1><p>Build a mental map of the neck, understand why notes work, and practice targeting chord tones when you improvise. Original lessons based on the topics in your JustinGuitar workbooks.</p><div class="controls"><button class="primary" id="resume">▶ Resume last activity</button><button id="startLesson">Browse lessons</button><button id="startGame">Play a game</button><button id="startJam">Open Jam Lab</button><button id="startStudio">Practice Studios</button></div></div><div class="grid"><div class="stat"><span class="muted">Lifetime XP</span><b>${state.xp}</b></div><div class="stat"><span class="muted">Answer accuracy</span><b>${state.attempts?Math.round(100*state.correct/state.attempts)+'%':'—'}</b></div><div class="stat"><span class="muted">Longest streak</span><b>${state.best}</b></div><div class="stat"><span class="muted">Lessons completed</span><b>${state.completed.length} / 2</b></div></div><div class="panel"><h2>What to do today</h2><div class="grid"><div><h3>1 · Understand</h3><p>Study one lesson with a playable fretboard and worked examples.</p></div><div><h3>2 · Retrieve</h3><p>Play two quick rounds without labels; test your memory before checking.</p></div><div><h3>3 · Make music</h3><p>Play over a C–F–G progression and aim for the current chord's root, third, or fifth.</p></div></div></div><div class="panel"><h2>Fretboard quick reference</h2><p class="muted">C major highlighted; orange = roots. Turn this mental map into immediate recognition.</p>${fretboard({show:'cmajor',clickable:false})}</div><p class="footer">A personal study companion. Not affiliated with or endorsed by JustinGuitar. No workbook pages or proprietary diagrams reproduced.</p>`;$('resume').onclick=resumeLast;$('startLesson').onclick=()=>go('learn');$('startGame').onclick=()=>go('games');$('startJam').onclick=()=>go('jam');$('startStudio').onclick=()=>go('studio')}
function resumeLast(){let loc=state.location||DEFAULT.location;if(loc.page==='learn'&&Number.isInteger(loc.lesson)&&lessonData[loc.lesson]){go('learn');openLesson(loc.lesson)}else if(loc.page==='games'){go('games');startMode(loc.mode||'find')}else go(['home','learn','games','jam','studio','progress'].includes(loc.page)?loc.page:'learn')}function learn(){let cards=lessonData.map((l,i)=>`<div class="panel"><div class="eyebrow">Lesson ${i+1} ${state.completed.includes(i)?'· completed ✓':''}</div><h2>${l.title}</h2><p class="muted">${l.source}</p><p>${l.parts.length} guided sections · interactive examples · playing assignment</p><button class="primary" data-openlesson="${i}">${state.completed.includes(i)?'Review lesson':'Open lesson'}</button></div>`).join('');app.innerHTML=`<div class="eyebrow">Foundations</div><h1>Learn the relationships</h1><p>Two detailed lessons are fully playable in this first prototype. Four later chapters—major scales, triads, connecting positions, and improvisation—are planned next; their game concepts are available as early previews.</p><div class="grid">${cards}</div><div class="panel soft"><h3>Next curriculum chapters</h3><p>3 · Major scales and scale degrees &nbsp; 4 · Triads and chord tones &nbsp; 5 · Position connections and CAGED &nbsp; 6 · Musical improvisation.</p></div>`;document.querySelectorAll('[data-openlesson]').forEach(b=>b.onclick=()=>openLesson(+b.dataset.openlesson))}
function openLesson(i){state.location={page:'learn',lesson:i,mode:mode};state.lesson=i;save();let l=lessonData[i];app.innerHTML=`<button id="back">← Lessons</button><div class="panel lesson"><div class="eyebrow">Lesson ${i+1} of 2</div><h1>${l.title}</h1><p class="muted">Aligned to: ${l.source}</p>${l.parts.map(([h,p],j)=>`<section><h3>${j+1}. ${h}</h3><p>${p}</p></section>`).join('')}<h2>Explore on the guitar</h2><p>Play these notes on the virtual fretboard, then locate them on your own instrument. Toggle the labels after studying.</p><div class="controls"><button id="labels" class="active">Hide note labels</button><button id="cscale">Highlight C major</button><button id="ctriad">Show C triad tones</button></div><div class="panel soft" style="margin:18px 0"><h3>Major Triad Explorer · All 12 roots</h3><p class="muted">Select a major chord. The guitar highlights its three notes everywhere on the neck, including repeated octaves. Orange = root; teal = third or fifth.</p><label for="triadchord"><strong>Choose a major chord</strong></label><select id="triadchord" style="max-width:280px;width:100%;margin:8px 0 12px;padding:10px;border-radius:9px;background:#213447;color:#f1f5f7;border:1px solid #667e8c">${MAJOR_TRIADS.map(([label,root])=>`<option value="${root}">${label} major</option>`).join('')}</select><div id="triadnotes" class="note" aria-live="polite"></div><button id="playtriad">▶ Hear triad</button><p class="small muted" style="margin:9px 0 0">Tip: tap any highlighted fret to hear it, then play root–third–fifth on your actual guitar. Your selected chord is remembered on return.</p></div><div id="lessonfb"></div><div id="feedback" class="feedback">Select a fret position to hear its note and see the pitch name.</div><h2>Apply it physically</h2><div class="note">${i===0?'Find C on every string between frets 1 and 12; then play all six locations in order and reverse.':'Play C on string 5 fret 3, then its octave on string 3 fret 5. Next, play C–E (major third) and C–Eb (minor third) on string 5. Sing the higher note after each pair.'}</div><div class="controls"><button class="primary" id="complete">${state.completed.includes(i)?'Completed ✓ · Practice again':'Mark lesson complete ✓'}</button><button id="practice">Practice in games →</button></div></div>`;$('back').onclick=()=>go('learn');let display='majortriad';let triadRoot=Number.isInteger(state.settings.chordRoot)?state.settings.chordRoot:0;function draw(){const entry=MAJOR_TRIADS.find(a=>a[1]===triadRoot)||MAJOR_TRIADS[0];$('triadchord').value=String(triadRoot);$('triadnotes').innerHTML=`<strong>${entry[0]} major = ${entry[2].join(' · ')}</strong><div class="small muted">Root (1): ${entry[2][0]} &nbsp;·&nbsp; Major third (3): ${entry[2][1]} &nbsp;·&nbsp; Perfect fifth (5): ${entry[2][2]}</div>`;$('lessonfb').innerHTML=fretboard({show:display,triadRoot,triadNames:entry[2]});attachFret((s,f)=>{tone(MIDI_OPEN[s-1]+f,.8);feedback(`String ${s}, fret ${f} = <strong>${name(s,f)}</strong>. ${f===12?'This is one octave above the open string.':''}`,true)})};$('triadchord').onchange=e=>{triadRoot=Number(e.target.value);state.settings.chordRoot=triadRoot;save();display='majortriad';draw()};$('playtriad').onclick=()=>chord(triadRoot,'major',1.3);draw();$('labels').onclick=()=>{display=display==='none'?'all':'none';$('labels').textContent=display==='none'?'Show note labels':'Hide note labels';draw()};$('cscale').onclick=()=>{display='cmajor';draw()};$('ctriad').onclick=()=>{triadRoot=0;display='majortriad';draw()};$('complete').onclick=()=>{if(!state.completed.includes(i)){state.completed.push(i);state.xp+=200;save()}$('complete').textContent='Completed ✓'};$('practice').onclick=()=>go('games')}

const FORGE=[{ask:'Complete the major scale formula:',options:['T–T–S–T–T–T–S','T–S–T–T–S–T–T','T–T–T–S–T–T–S'],right:0,why:'Every major scale moves tone, tone, semitone, tone, tone, tone, semitone.'},{ask:'Which three notes make a C major triad?',options:['C–E–G','C–Eb–G','C–F–G'],right:0,why:'Major triads use 1–3–5. For C, that means C, E and G.'},{ask:'Which note changes when C major becomes C minor?',options:['The root C becomes B','The third E becomes Eb','The fifth G becomes F#'],right:1,why:'Minor triads lower the major third by one semitone while retaining root and perfect fifth.'},{ask:'On one string, a major third is how many frets?',options:['3','4','5'],right:1,why:'A major third is four semitones. Each fret corresponds to one semitone.'},{ask:'What is the perfect fifth of F?',options:['Bb','C','D'],right:1,why:'F major is F G A Bb C D E. Its fifth degree is C.'},{ask:'Which are the notes of F major?',options:['F–A–C','F–Ab–C','F–A–Db'],right:0,why:'F major triad uses F (root), A (major third), and C (perfect fifth).'}, {ask:'The distance B to C is:',options:['A semitone','A whole tone','A major third'],right:0,why:'B–C and E–F are the adjacent natural-note semitone pairs.'},{ask:'In a C–F change, which note is common to both major triads?',options:['E','C','F'],right:1,why:'C major is C–E–G and F major is F–A–C. C is a common tone.'}];

const EARS=[{semitones:1,label:'semitone',other:'whole tone'},{semitones:2,label:'whole tone',other:'semitone'},{semitones:3,label:'minor third',other:'major third'},{semitones:4,label:'major third',other:'minor third'},{semitones:7,label:'perfect fifth',other:'perfect fourth'},{semitones:5,label:'perfect fourth',other:'perfect fifth'},{semitones:12,label:'octave',other:'perfect fifth'}];function qEar(){let q=pick(EARS),base=50+rand(12),opts=Math.random()<.5?[q.label,q.other]:[q.other,q.label];question={...q,base};gameShell('Ear Detective',`<h2>Listen, then name the interval</h2><p>Two ascending notes will play. Try singing the second note before answering.</p><div class="controls"><button class="primary" id="playpair">▶ Play interval</button><button id="playagain">↻ Replay</button></div><div class="choices">${opts.map(o=>`<button data-answer="${o}">${o}</button>`).join('')}</div>${nextButton()}`);bindNext();function play(){tone(base,.65,0,.17);tone(base+q.semitones,.8,.85,.17)}$('playpair').onclick=play;$('playagain').onclick=play;document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>result(b.dataset.answer===q.label,`The interval is a <strong>${q.label}</strong>: ${q.semitones} semitone${q.semitones!==1?'s':''} (${q.semitones} fret${q.semitones!==1?'s':''} on one string).`,'ear'))}

function stopJam(){jamRunning=false;if(jamTimer)clearInterval(jamTimer);jamTimer=null}function jam(){stopJam();jamChord=0;app.innerHTML=`<div class="eyebrow">Make music</div><h1>Jam Lab: C–F–G–C</h1><p>Play a simple I–IV–V progression while looking at available notes and chord tones. Use your real guitar alongside the audio. The app cannot yet verify what you play.</p><div class="panel"><div class="controls"><label for="bpm">Tempo</label><select id="bpm"><option>60</option><option selected>80</option><option>100</option><option>120</option></select><label for="highlight">Show</label><select id="highlight"><option value="triad">Current chord tones</option><option value="scale">C major scale</option><option value="none">No note hints</option></select><button class="primary" id="jamplay">▶ Start progression</button><button id="jamstop">■ Stop</button></div><div id="jamstatus" class="note">Ready: play a note from C major.</div><div id="jamfb"></div><div id="feedback" class="feedback">Tap a fret to hear it. Try to land on the current chord's third when the chord changes.</div></div><div class="panel"><h2>Three musical missions</h2><div class="grid"><div class="task"><h3>1. Roots</h3><p>Play C on C, F on F, and G on G. Hold each target note long enough to hear how it settles.</p></div><div class="task"><h3>2. Thirds</h3><p>Aim for E over C, A over F, and B over G. These thirds establish each chord's major quality.</p></div><div class="task"><h3>3. Small phrases</h3><p>Create a three- or four-note idea, leave silence, then answer it. Move between two areas of the neck.</p></div></div><div class="note warning">A chord sounding in the background does not make every scale note equally stable. Chord tones are landing targets; non-chord scale notes can create tension and movement.</div></div>`;let progress=[CHORDS[0],CHORDS[1],CHORDS[2],CHORDS[0]];function update(){let q=progress[jamChord];$('jamstatus').innerHTML=`Now playing: <strong>${q.label}</strong> · aim for <strong>${q.tones.map(i=>N[i]).join(' / ')}</strong> · chord ${jamChord+1}/4`;let v=$('highlight').value,highlights=[];if(v==='triad')for(let s=1;s<=6;s++)for(let f=0;f<=12;f++)if(q.tones.includes(pitch(s,f)))highlights.push({s,f});$('jamfb').innerHTML=fretboard({show:v==='scale'?'cmajor':'none',highlights});attachFret((s,f)=>{tone(MIDI_OPEN[s-1]+f,.8);feedback(`Played <b>${name(s,f)}</b>. ${q.tones.includes(pitch(s,f))?'Chord tone — strong landing note.':MAJOR.includes(pitch(s,f))?'Part of C major, but not a chord tone right now.':'Outside the C major scale; try hearing its tension.'}`,q.tones.includes(pitch(s,f)))})}update();$('highlight').onchange=update;$('jamplay').onclick=()=>{stopJam();jamChord=0;jamRunning=true;function beat(){chord(progress[jamChord].root,'major',1.15);update();jamChord=(jamChord+1)%4}beat();let bpm=+$('bpm').value;jamTimer=setInterval(beat,60000/bpm*4);$('jamplay').textContent='↻ Restart progression'};$('jamstop').onclick=()=>{stopJam();$('jamstatus').textContent='Stopped. Choose a new mission or restart.'}}

  $('stslot').oninput=e=>{st.looperSlot=e.target.value;save()};

  $('stsave').onclick=()=>{st.logs.unshift({at:Date.now(),style:'electric',key:st.key,bpm:st.bpm,slot:st.looperSlot,notes:st.loopNotes,mission:m[0]});st.logs=st.logs.slice(0,60);save();$('stsave').textContent='Saved ✓'};
 }else{
  $('stcontent').innerHTML='<h2>Acoustic · Bluegrass Jam Academy</h2><p>Train for the real moment: somebody calls a key, you find I–IV–V immediately, play steady boom-chuck rhythm, then take a short break without stopping the group.</p>'+
  '<div class="note"><h3>Jam leader calls: “Key of '+k.key+'!”</h3><p>At '+st.bpm+' BPM, say the I, IV and V chords aloud before revealing them. Then name each chord\'s root, third and fifth.</p><button id="stshow">'+(st.showHints?'Hide answers':'Reveal chords and notes')+'</button><div id="streveal" style="margin-top:10px"></div></div>'+
  '<div class="grid"><div class="task"><h3>1 · Join the rhythm</h3><p>One bass note on beat 1, a light chord on beat 2, bass on 3, chord on 4. Keep steady time for two choruses before considering a lead break.</p></div>'+
  '<div class="task"><h3>2 · Follow chord changes</h3><p>On every new chord, land on its root. Repeat targeting the third. Use the scale notes between targets, not as a continuous scale run.</p></div>'+
  '<div class="task"><h3>3 · Take an 8-bar break</h3><p>Play a two-bar melodic idea, answer it, move to another neck position, and resolve home. If lost, return to rhythm on the next chord.</p></div>'+
  '<div class="task"><h3>4 · Tempo ladder</h3><p>Play cleanly and in time three times before raising the BPM. If it falls apart, simplify the break and step down 10 BPM.</p></div></div>'+
  '<h3>Choose backing audio</h3><div class="note" id="bbtlinks"></div>'+
  '<h3>Track your comfortable jam tempo</h3><p class="small muted">Select a BPM above, practice, then explicitly mark it comfortable. This records your own assessment, not automatic audio grading.</p>'+
  '<div class="controls"><button class="primary" id="stcomfortable">Mark '+st.bpm+' BPM comfortable</button><span id="stbest" class="muted"></span></div>'+
  keyInfo+'<h3>Fretboard map · '+k.key+' major</h3><p>Use this to prepare, then hide the hints and play by memory.</p><div id="stneck"></div>';
  function hints(){let visible=st.showHints;$('streveal').innerHTML=visible?chordhtml:'<p class="muted small">Answers hidden. Say them, then check your work.</p>';$('stneck').innerHTML=fretboard({show:'none',highlights:visible?fretHighlights:[],clickable:true});attachFret((ss,f)=>tone(MIDI_OPEN[ss-1]+f,.7))}
  hints();$('stshow').onclick=()=>{st.showHints=!st.showHints;save();studio()};
  $('bbtlinks').innerHTML='<strong>BBT Bluegrass Backing Tracks</strong><p class="small">Use the creator\'s recordings to build real-time jam responses. Only recordings individually verified are presented as exact matches.</p>'+
   (k.key==='G' ? '<p><a target="_blank" rel="noopener noreferrer" href="https://www.youtube.com/watch?v=uE1I2Hzkvig">▶ Nothing But G — G chord drone, 100 BPM (verified BBT recording)</a><br><span class="small muted">Single-chord rhythm, useful for scale and phrasing work; not a I–IV–V progression.</span></p>':'')+
   '<p><a target="_blank" rel="noopener noreferrer" href="https://www.youtube.com/@bbtbluegrassbackingtracks">▶ BBT channel and its tempo playlists (80, 90, 100, 110, 120 BPM)</a></p>'+
   '<p><a target="_blank" rel="noopener noreferrer" href="https://www.youtube.com/results?search_query='+encodeURIComponent('BBT bluegrass backing tracks '+k.key+' '+st.bpm+' bpm')+'">Find tracks in '+k.key+' around '+st.bpm+' BPM (YouTube search, not a verified exact track)</a></p>';
  $('stbest').textContent='Your recorded best in '+k.key+': '+(st.bestTempo[k.key]||'not set')+' BPM';
  $('stcomfortable').onclick=()=>{st.bestTempo[k.key]=Math.max(st.bestTempo[k.key]||0,st.bpm);st.logs.unshift({at:Date.now(),style:'bluegrass',key:st.key,bpm:st.bpm,mission:'Comfortable tempo (self-reported)'});st.logs=st.logs.slice(0,60);save();$('stbest').textContent='Your recorded best in '+k.key+': '+st.bestTempo[k.key]+' BPM';$('stcomfortable').textContent='Recorded ✓'};
 }
 if(st.style==='electric')attachFret((ss,f)=>tone(MIDI_OPEN[ss-1]+f,.7));
 const log=st.logs.filter(x=>x.style===st.style).slice(0,6);
 $('stcontent').insertAdjacentHTML('beforeend','<h3>Recent '+(st.style==='electric'?'electric':'bluegrass')+' sessions</h3><div class="note">'+(log.length?log.map(x=>'<div class="small">'+new Date(x.at).toLocaleDateString()+' · '+escapeHtml(x.key)+' · '+x.bpm+' BPM · '+escapeHtml(x.mission)+(x.slot?' · Ditto+ '+escapeHtml(x.slot):'')+'</div>').join(''):'<span class="muted">Your next saved session will appear here.</span>')+'</div>');
}

function progress(){let byMode={};state.history.forEach(h=>{let m=byMode[h.label]||(byMode[h.label]={ok:0,n:0});m.n++;if(h.ok)m.ok++});app.innerHTML=`<div class="eyebrow">Your practice record</div><h1>Progress</h1><div class="grid"><div class="stat">XP<b>${state.xp}</b></div><div class="stat">Correct answers<b>${state.correct} / ${state.attempts}</b></div><div class="stat">Best streak<b>${state.best}</b></div></div><div class="panel"><h2>Skills by game</h2>${['fretboard','theory','ear','quest'].map(m=>{let v=byMode[m]||{ok:0,n:0},pct=v.n?Math.round(v.ok/v.n*100):0;return `<div class="task"><strong>${({fretboard:'Fretboard Explorer',theory:'Theory Forge',ear:'Ear Detective',quest:'Improvisation Quest'})[m]}</strong><span class="muted"> · ${v.n} attempts · ${v.n?pct+'% correct':'not yet practiced'}</span><div class="progress"><div class="bar" style="width:${pct}%"></div></div></div>`}).join('')}</div><div class="panel"><h2>Practice preferences</h2><label><input type="checkbox" id="sound" ${state.settings.sound?'checked':''}> Enable synthesized sound</label><p class="muted small">Every answer, completed lesson, setting, and last visited section saves automatically in this browser. Optional Google Sheets backup below syncs the same progress across devices. You can review any lesson or game at any time.</p><div class="note"><strong>Google Sheets cloud backup</strong><p class="muted small" data-cloud-status>Local saving active</p><label for="cloudurl">Apps Script Web App URL (/exec)</label><input id="cloudurl" style="width:100%;margin:6px 0 12px" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off"><label for="cloudkey">Private profile / recovery code</label><input id="cloudkey" style="width:100%;margin:6px 0 12px" placeholder="Use same code on every device" autocomplete="off"><div class="controls"><button id="makekey">Generate profile code</button><button class="primary" id="connectcloud">Connect & restore</button><button id="cloudbackup">Backup now</button><button id="cloudrestore">Restore from Sheets</button></div><p id="clouderror" class="small"></p><p class="small muted">Keep your profile code private. Anyone with the same code and endpoint can access that profile. Google Sheets stores the progress; no Google sign-in appears inside this app. A sent backup cannot be independently confirmed by this HTML due to cross-origin restrictions; use Restore from Sheets to verify it.</p></div><button id="reset">Reset all progress</button></div>`;$('sound').onchange=e=>{state.settings.sound=e.target.checked;save()};$('cloudurl').value=cloud.url;$('cloudkey').value=cloud.key;updateCloudLabel();$('makekey').onclick=()=>{$('cloudkey').value=generateKey();$('clouderror').textContent='Save this code somewhere safe so you can use it on your other device.'};$('connectcloud').onclick=()=>{$('clouderror').textContent=setCloudConfig($('cloudurl').value,$('cloudkey').value)};$('cloudbackup').onclick=()=>{cloudLastUpload=0;syncCloud(true);updateCloudLabel()};$('cloudrestore').onclick=loadCloud;$('reset').onclick=()=>{if(confirm('Delete all local Fretboard Freedom progress on this browser?')){state=structuredClone(DEFAULT);state.updatedAt=Date.now();persistLocal();cloudStatus='Local progress reset. Cloud backup is retained until your next backup or sync.';progress()}}}
render();if(cloud.url&&safeKey(cloud.key))loadCloud();
</script></body></html>
